<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font: 13px/1.4 Inter, sans-serif;
        margin: 0;
        background: #fff;
      }
      #title {
        font-weight: 600;
        padding: 12px 16px;
        border-bottom: 1px solid #eee;
      }
      /*---------------Checklist Bar---------------*/
      #checklist {
        position: sticky;
        top: 0;
        z-index: 10;
        background: #fff;
        border-bottom: 1px solid #eee;
        padding: 8px 16px;
      }

      #checklist header {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #progress {
        font-size: 11px;
        color: #888;
        flex: 1;
      }

      .bullet {
        font-size: 14px;
      }

      #toggleChk {
        cursor: pointer;
        border: none;
        background: none;
        font-size: 12px;
      }

      .chk-item {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
      }
      .chk-item button {
        margin-left: auto;
        font-size: 11px;
        cursor: pointer;
        background: #18a0fb;
        color: #fff;
        border: none;
        padding: 2px 8px;
        border-radius: 4px;
      }

      /* ───────── Layer tree ───────── */
      #list {
        padding: 6px 0 14px;
        position: relative;
      }
      .row {
        position: relative;
        padding-left: 24px;
        min-height: 24px;
        display: flex;
        align-items: center;
        cursor: pointer;
      }
      .row:hover {
        background: #f5f5f5;
      }
      .row::before {
        content: "";
        position: absolute;
        left: 16px;
        top: -12px;
        bottom: -12px;
        width: 1px;
        background: #eee;
      }

      .row.top {
        margin-top: 6px; /* space *above* each section  */
      }

      .row.top:first-child {
        margin-top: 0; /* keep the very first one tight */
      }

      .branch {
        font-family: SFMono, Menlo, monospace;
        font-size: 12px;
      }

      .pill.auto {
        background: #4caf50;
        color: #fff;
      }
      .pill.suggest {
        background: #ffc107;
        color: #000;
      }
      .pill.error {
        background: #d33;
        color: #fff;
      }

      /* ───────── Section panel (drill-down) ───────── */
      #section {
        display: none;
        padding: 12px 16px;
        border-top: 1px solid #eee;
      }
      #breadcrumbs {
        font-size: 11px;
        color: #888;
        margin-bottom: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #section-name {
        font-weight: 600;
        margin-bottom: 6px;
      }
      #section-action {
        width: 100%;
        background: #18a0fb;
        color: #fff;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 13px;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div id="title">Layra Layers</div>

    <!-- ░░ Checklist Bar ░░ -->
    <div id="checklist">
      <header>
        <span>🔗 Dev-Ready Checklist</span>
        <span id="progress">●○○○○</span>
        <button id="toggleChk" aria-label="Collapse">—</button>
      </header>

      <div id="chk-items">
        <!-- items injected by JS -->
        <!--
        <div class="chk-item" data-id="fix-order">
          <span class="bullet">[!]</span> Fix stacking order
          <button>Fix Now</button>
        </div>
        -->
      </div>
    </div>

    <!-- ░░ Layer Tree ░░ -->
    <div id="list"></div>
    <button
      id="show-all"
      style="display: none; margin: 0 0 12px 16px; font-size: 11px"
    >
      Show All Layers…
    </button>

    <!-- ░░ Section Panel (drill-down) ░░ -->
    <div id="section">
      <div id="breadcrumbs"></div>
      <div id="section-name"></div>
      <span id="section-role" class="pill"></span>
      <button id="section-action"></button>
      <button id="export-json" style="margin-top: 8px; font-size: 12px">
        📦 Export JSON
      </button>
      <pre
        id="json-output"
        style="
          white-space: pre-wrap;
          padding: 8px;
          border: 1px solid #eee;
          display: none;
          height: 200px;
          overflow: auto;
        "
      ></pre>
    </div>

    <script>
      /* =========================================================================
            STATE
        ====================================================================== */
      // Reference elements once
      const exportBtn = document.getElementById("export-json");
      const jsonBox = document.getElementById("json-output");

      let checklistCollapsed = false;
      let CHECKLIST_MAX_VISIBLE = 3; // Show 3 items, then "Show all layers..."
      let showAllLayers = false;

      let treeData = null; // latest NodeInfo tree from plugin
      let dragNode = null; // Node being dragged (NodeInfo ref)
      let dragElm = null; // <div.row> element being dragged
      let dropInfo = null; // {targetId, node:'before'|'after'|'child'}

      const listEl = document.getElementById("list");
      const bar = document.createElement("div"); // drop indicator
      bar.style.cssText =
        "position:absolute;height:0;border-top:2px solid #18a0fb;pointer-events:none;display:none";
      listEl.appendChild(bar);

      /* =========================================================================
            MESSAGE HANDLERS (hook these back to your plugin messages)
        ====================================================================== */
      onmessage = ({ data }) => {
        const msg = data.pluginMessage;
        if (!msg) return;

        if (msg.type === "CLEAR") {
          clearUI();
          return;
        }

        if (msg.type === "AUDIT_DATA") {
          treeData = msg.payload.layers[0]; // New Addition
          renderChecklist(msg.payload.summary);
          renderLayerPreview(); // root frame children
        }

        if (msg.type === "SECTION_CONTEXT") {
          openSection(msg.payload);
        }

        if (msg.type === "SECTION_JSON") {
          jsonBox.style.display = "block";
          jsonBox.textContent = JSON.stringify(msg.payload, null, 2);
        }
      };

      /* =========================================================================
        CHECKLIST RENDER
        ====================================================================== */
      function renderChecklist(summary) {
        const items = [];

        if (summary.hasOrderWarning)
          items.push({ id: "fix-order", label: "Fix stacking order" });

        if (summary.hasGroupSuggestion)
          items.push({ id: "group-layers", label: "Group layers" });

        if (summary.renameCount > 0)
          items.push({
            id: "rename-layers",
            label: `Rename ${summary.renameCount} layer${
              summary.renameCount > 1 ? "s" : ""
            }`,
          });

        //progress dots
        const done = items.filter((i) => i.done).length;
        document.getElementById("progress").textContent =
          "●".repeat(done) + "○".repeat(items.length - done);

        //list
        const wrap = document.getElementById("chk-items");
        wrap.innerHTML = "";
        items.forEach((it, i) => {
          const row = document.createElement("div");
          row.className = "chk-item";
          if (checklistCollapsed && i > 0) row.style.display = "none";

          row.innerHTML = `
                <span class="bullet">[!]</span>
                <span>${it.label}</span>
                <button>Fix&nbsp;Now</button>
                `;
          row.querySelector("button").onclick = () =>
            parent.postMessage({ pluginMessage: { type: it.id } }, "*");
          wrap.appendChild(row);
        });

        // collapse/expand
        document.getElementById("toggleChk").textContent = checklistCollapsed
          ? "+"
          : "-";
      }

      /* =========================================================================
   LAYER PREVIEW  (branch-style tree + “Show all”)
   ====================================================================== */

      const showAllBtn = document.getElementById("show-all");

      function renderLayerPreview() {
        if (!treeData) return;
        listEl.innerHTML = "";
        let shown = 0;
        appendChildren(treeData.children, 0, false); // ← recursive printer

        function appendChildren(nodes, depth) {
          nodes.forEach((n, i) => {
            const last = i === nodes.length - 1;
            if (!showAllLayers && shown >= CHECKLIST_MAX_VISIBLE) {
              showAllBtn.style.display = "block";
              return;
            }
            listEl.appendChild(makeRow(n, depth, last));
            shown++;
            if (n.children?.length) appendChildren(n.children, depth + 1);
          });
        }
      }

      showAllBtn.onclick = () => {
        showAllLayers = true;
        showAllBtn.style.display = "none";
        parent.postMessage({ pluginMessage: { type: "REQUEST_REFRESH" } }, "*");
      };

      function makeRow(node, depth, last) {
        const row = document.createElement("div");
        row.className = "row" + (depth === 0 ? " top" : "");
        row.draggable = true; /* DND */
        row.dataset.id = node.id; /* DND */
        row.style.paddingLeft = 16 + depth * 12 + "px";

        const branch =
          depth === 0
            ? ""
            : `<span class="branch">${last ? "└── " : "├── "}</span>`;

        row.innerHTML = `${branch}<span>${node.name || "(unnamed)"}</span>
      ${
        node.layout
          ? `<span class="pill ${node.layout}">${node.layout}</span>`
          : ""
      }`;

        /* —— Selection passthrough —— */
        row.onclick = (e) => {
          if (e.target.closest(".pill")) return; // ignore pill clicks
          parent.postMessage(
            { pluginMessage: { type: "SELECT_LAYER", id: node.id } },
            "*"
          );
        };

        /* ————— DND Handlers ————— */
        row.addEventListener("dragstart", (e) => {
          dragNode = node;
          dragElm = row;
          const ghost = document.createElement("div");
          document.body.appendChild(ghost);
          e.dataTransfer.setDragImage(ghost, 0, 0);
        });

        row.addEventListener("dragover", (e) => {
          e.preventDefault(); // allow drop
          const rect = row.getBoundingClientRect();
          const y = e.clientY - rect.top;
          const mode =
            y < rect.height / 3
              ? "before"
              : y > (rect.height * 2) / 3
              ? "after"
              : "child";

          /* prevent invalid (self/descendant) */
          if (isInvalidDrop(node)) {
            bar.style.display = "none";
            return;
          }

          dropInfo = { targetId: node.id, mode, depth };
          if (mode == "child") {
            bar.style.display = "none";
            row.classList.add("drop-parent");
          } else {
            row.classList.remove("drop-parent");
            bar.style.display = "block";
            bar.style.left = 16 + depth * 12 + "px";
            bar.style.top =
              (mode === "after" ? rect.bottom : rect.top) -
              listEl.getBoundingClientRect().top +
              "px";
            bar.style.width = "calc(100% - " + (16 + depth * 12) + "px)";
          }
        });

        row.addEventListener("dragleave", () => {
          row.classList.remove("drop-parent");
        });

        row.addEventListener("drop", (e) => {
          e.preventDefault();
          finalizeDrop();
        });

        return row;
      }

      /* ──────────────────────────────────────────────
      DROP VALIDATION & APPLY
      ───────────────────────────────────────────────*/
      function isInvalidDrop(targetNode) {
        if (!dragNode) return true;
        if (dragNode.id === targetNode.id) return true;
        // simple descendant check (walk up)
        let cur = targetNode;
        while (cur) {
          if (cur.id === dragNode.id) return true;
          cur = cur.parentRef; // we'll add this link when we build tree
        }
        return false;
      }

      function finalizeDrop() {
        if (!dropInfo) {
          cleanupDnD();
          return;
        }
        parent.postMessage(
          {
            pluginMessage: {
              type: "MOVE_LAYER",
              nodeId: dragNode.id,
              targetId: dropInfo.targetId,
              mode: dropInfo.mode, // before | after | child
            },
          },
          "*"
        );
        cleanupDnD();
      }

      function cleanupDnD() {
        bar.style.display = "none";
        document
          .querySelectorAll(".drop-parent")
          .forEach((el) => el.classList.remove("drop-parent"));
        dragNode = null;
        dropInfo = null;
      }

      /* ──────────────────────────────────────────────
      "Show all layers…" + rest identical as before
       ───────────────────────────────────────────────*/
      document.getElementById("show-all").onclick = () => {
        showAllLayers = true;
        document.getElementById("show-all").style.display = "none";
        parent.postMessage({ pluginMessage: { type: "REQUEST_REFRESH" } }, "*");
      };

      /* =========================================================================
      SECTION PANEL
      ====================================================================== */
      function openSection(p) {
        const sec = document.getElementById("section");
        sec.style.display = "block";

        document.getElementById("breadcrumbs").textContent = p.breadcrumbs
          .map((b) => b.name)
          .join(" / ");
        document.getElementById("section-name").textContent = p.targetName;
        const role = document.getElementById("section-role");
        if (p.role) {
          role.textContent = p.role === "applied" ? "Auto ✅" : "Suggest ⚠️";
          role.className =
            "pill " + (p.role === "applied" ? "auto" : "suggest");
        } else {
          role.textContent = "";
          role.className = "pill";
        }

        const btn = document.getElementById("section-action");
        btn.textContent =
          p.role === "applied" ? "Remove Auto Layout" : "Apply Auto Layout";
        btn.onclick = () =>
          parent.postMessage(
            {
              pluginMessage: {
                type: p.role === "applied" ? "REMOVE_AUTO" : "APPLY_AUTO",
                id: p.targetId,
              },
            },
            "*"
          );

        exportBtn.onclick = () => {
          // ask plugin for JSON of the currently opened* section
          parent.postMessage({ pluginMessage: { type: "REQUEST_JSON" } }, "*");
        };
      }

      /* =========================================================================
      HELPERS
      ====================================================================== */
      function clearUI() {
        document.getElementById("list").innerHTML = "";
        document.getElementById("chk-items").innerHTML = "";
        document.getElementById("section").style.display = "none";
        document.getElementById("show-all").style.display = "none";
      }

      document.getElementById("toggleChk").onclick = () => {
        checklistCollapsed = !checklistCollapsed;
        // simple re-order
        const evt = new Event("dummy"); // trigger nothing; renderChecklist will run on next AUDIT update
        onmessage({
          data: {
            pluginMessage: { type: "AUDIT_DATA", payload: { summary: {} } },
          },
        });
      };
    </script>
  </body>
</html>

<!-- Design 01 -->
<!-- Detect and Display Basic Layer Info -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma Selection</title>
  <style>
    body {font-family: Arial, sans-serif; padding: 10px; width: 10px; width: 250px;}
    h2 { font-size: 14px;}
    pre {font-size:12px; background: #eee; padding: 5px;}
  </style>
</head>
<body>
  <h2>Selected Layer</h2>
  <pre id="output">No selection yet...</pre>
  <script>
    // Receive data from Figma
    window.onmessage = (event) => {
      const data = event.data.pluginMessage;
      if(!data) {
        document.getElementById("output").innerText = "No selection yet...";
        return;
      }
      document.getElementById("output").innerText = `
      Name: ${data.name}
      Type: ${data.type}
      width: ${data.width}px
      Height: ${data.height}px
      `
    }
  </script>
</body>
</html>

<!-- VERSION 04 -->
 <h2>Selected Layers</h2>
 <ul id="layer-list"></ul>
 <button id="reset">Reset Selection</button>
 <script>
  function updateLayerList(layers) {
    const listElement = document.getElementById("layer-list");
    listElement.innerHTML = ""; // Clear previous list

    if(layers.length === 0) {
      listElement.innerHTML = "<p>No layers selected.</p>";
    } else {
      layers.forEach(layer => {
        const li = document.createElement("li");
        li.innerText = layer;
        listElement.appendChild(li);
      });
    }
  }

  window.onmessage = (event) => {
      if(event.data.pluginMessage) {
        updateLayerList(event.data.pluginMessage.layers);
      }
  };

  document.getElementById("reset").onclick = () => {
    parent.postMessage({ pluginMessage: "resetSelection"}, "*");
  }
 </script>
